name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` over `npm install` — it installs exactly what the lockfile
      # pins, so a green run here means the same tree a fresh clone would get.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
