<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07080c" />
  <meta name="description"
    content="Kylie Beck — full-stack developer in Los Angeles building scalable web applications and intuitive user interfaces." />

  <title>Kylie Beck — Full-Stack Developer</title>

  <!-- Open Graph requires absolute URLs — relative paths render no preview card
       in LinkedIn, Slack, iMessage, or email. If the site ever moves to a custom
       domain, these four URLs have to move with it. -->
  <link rel="canonical" href="https://portfolio-kylie.up.railway.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kylie Beck" />
  <meta property="og:title" content="Kylie Beck — Full-Stack Developer" />
  <meta property="og:description"
    content="Full-stack developer in Los Angeles building scalable web applications and intuitive user interfaces. React, Node, PostgreSQL, Python." />
  <meta property="og:url" content="https://portfolio-kylie.up.railway.app/" />
  <meta property="og:image" content="https://portfolio-kylie.up.railway.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Kylie Beck — full-stack developer who ships." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kylie Beck — Full-Stack Developer" />
  <meta name="twitter:description"
    content="Full-stack developer in Los Angeles building scalable web applications and intuitive user interfaces." />
  <meta name="twitter:image" content="https://portfolio-kylie.up.railway.app/og-image.png" />

  <!-- Set the theme before first paint so there is no light-mode flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) { /* private mode — fall back to the dark default */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
